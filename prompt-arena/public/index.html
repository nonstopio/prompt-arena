<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prompt Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12111a; --panel:#1c1a26; --raise:#242131; --line:#302c40;
  --text:#f2efea; --muted:#948ead; --amber:#f2a03d; --cyan:#5fd0d6; --rose:#e8687f;
  --display:'Bricolage Grotesque',Georgia,serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--ink);color:var(--text);
  font-family:var(--body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:2px}

.brand{height:30px;width:auto;background:#fff;border-radius:7px;padding:5px 9px;display:block}
.brandrow{display:flex;align-items:center;gap:14px}
.brandfoot{display:flex;justify-content:center;padding:44px 0 0;opacity:.55}
.brandfoot .brand{height:24px}
.wrap{max-width:860px;margin:0 auto;padding:28px 20px 96px}

header.bar{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;flex-wrap:wrap;margin-bottom:34px;
}
.logo{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0}
.logo span{color:var(--amber)}
.who{font-size:14px;color:var(--muted)}
.who b{color:var(--text);font-weight:600}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:14px}
.linkish:hover{color:var(--text)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px}
h2{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
p.lede{color:var(--muted);margin:0 0 22px;max-width:60ch}

label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
input[type=text],textarea{
  width:100%;background:var(--ink);color:var(--text);
  border:1px solid var(--line);border-radius:10px;padding:13px 14px;
  font:inherit;resize:vertical;
}
input[type=text]:focus,textarea:focus{border-color:var(--amber);outline:none}
textarea{min-height:130px;line-height:1.6}

.btn{
  background:var(--amber);color:#1a1205;border:0;border-radius:10px;
  padding:13px 22px;font-weight:600;letter-spacing:.005em;
  transition:filter .15s ease,transform .06s ease;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}

/* the clock is the loud element */
.clockrow{
  display:flex;align-items:center;justify-content:space-between;
  gap:18px;flex-wrap:wrap;margin-bottom:20px;
}
.clock{
  font-family:var(--display);font-weight:700;
  font-size:clamp(52px,13vw,86px);line-height:.9;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;color:var(--amber);
}
.clock.urgent{color:var(--rose)}
.clocklabel{font-size:14px;color:var(--muted);max-width:26ch}
.tally{font-size:14px;color:var(--muted)}
.tally b{color:var(--cyan);font-weight:600}

.target{
  border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:var(--raise);margin-bottom:24px;aspect-ratio:1;
}
.target img,.target canvas{width:100%;height:100%;object-fit:cover;display:block}
.target{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.target canvas{pointer-events:none;-webkit-user-drag:none}
.target.hidden-guard canvas{visibility:hidden}
.guard{
  position:absolute;inset:0;display:none;place-items:center;text-align:center;
  background:var(--raise);color:var(--muted);padding:24px;font-size:15px;line-height:1.6;
  z-index:2;
}
.guard b{color:var(--rose);font-weight:600}
.target.hidden-guard canvas{filter:blur(34px);transform:scale(1.08)}
.target.hidden-guard .guard{display:grid}
.shimmer{width:100%;height:100%;background:linear-gradient(100deg,var(--raise) 30%,#2e2a3e 50%,var(--raise) 70%);background-size:220% 100%;animation:sweep 1.5s linear infinite}
@keyframes sweep{to{background-position:-220% 0}}
@media (prefers-reduced-motion:reduce){.shimmer{animation:none}}

.roster{margin-top:30px}
.roster h3{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;color:#ddd6e6}
.chip.me{border-color:var(--amber);color:var(--amber)}
.chip.done{border-color:rgba(95,208,214,.45);color:var(--cyan)}
.rosterempty{color:var(--muted);font-size:14px}
.err{color:var(--rose);font-size:14px;margin-top:12px;min-height:20px}
.hint{color:var(--muted);font-size:14px;margin-top:10px}

.state{text-align:center;padding:52px 20px}
.state h2{margin-bottom:10px}
.dot{
  width:9px;height:9px;border-radius:50%;background:var(--cyan);
  display:inline-block;margin-right:8px;vertical-align:middle;
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}

/* results */
.shot{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--raise);margin:0 0 10px}
.shot img{width:100%;height:auto;display:block}
.shotcap{color:var(--muted);font-size:14px;margin:0 0 30px}
.verdict{border-left:3px solid var(--amber);padding:4px 0 4px 20px;margin:0 0 34px}
.verdict h3{font-family:var(--display);font-size:20px;margin:0 0 10px;font-weight:700}
.verdict p{margin:0;color:#ddd6e6}

.reveal{background:var(--raise);border:1px dashed var(--line);border-radius:12px;padding:18px 20px;margin-bottom:34px}
.reveal h3{font-size:14px;font-weight:600;margin:0 0 8px;color:var(--muted)}
.reveal code{font-family:var(--body);font-size:15px;color:var(--cyan);line-height:1.6}

.entry{
  display:grid;grid-template-columns:132px 1fr;gap:20px;
  padding:22px 0;border-top:1px solid var(--line);align-items:start;
}
.entry:first-of-type{border-top:0}
.entry.win{background:linear-gradient(90deg,rgba(242,160,61,.09),transparent 70%);border-radius:12px;padding:22px 18px;margin:0 -18px}
.thumb{border-radius:10px;overflow:hidden;background:var(--raise);aspect-ratio:1}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.none{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:10px}
.ehead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.rank{font-family:var(--display);font-size:19px;font-weight:700;color:var(--muted)}
.entry.win .rank{color:var(--amber)}
.pname{font-weight:600}
.pscore{margin-left:auto;font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.pprompt{margin:0 0 10px;color:#ddd6e6}
.pnotes{margin:0;font-size:14px;color:var(--muted)}
.crown{font-size:13px;color:var(--amber);font-weight:600}
.flag{
  font-size:12px;font-weight:600;color:var(--rose);
  border:1px solid rgba(232,104,127,.45);border-radius:999px;padding:3px 10px;
}
.flagnote{color:var(--muted);font-size:13px;margin:18px 0 0;line-height:1.5;max-width:62ch}

@media (max-width:560px){
  .entry{grid-template-columns:84px 1fr;gap:14px}
  .entry.win{margin:0 -12px;padding:22px 12px}
}
.rules{margin:0 0 4px;padding:0;list-style:none}
.rules li{position:relative;padding:0 0 12px 22px;color:#ddd6e6;font-size:15px;line-height:1.55}
.rules li::before{content:'';position:absolute;left:2px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.rules li.warn::before{background:var(--rose)}
.rules b{font-weight:600}
.thumb,.shot{cursor:zoom-in}
.lightbox{
  position:fixed;inset:0;z-index:50;display:none;
  background:rgba(8,7,12,.93);padding:28px;
  padding-top:calc(28px + env(safe-area-inset-top,0px));
  padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
}
.lightbox.open{display:grid;grid-template-rows:auto 1fr;gap:16px}
.lbhead{display:flex;align-items:center;justify-content:space-between;gap:14px;color:var(--text)}
.lbname{font-family:var(--display);font-weight:700;font-size:19px}
.lbbody{display:grid;place-items:center;min-height:0}
.lbbody img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.callout{
  border:1px solid rgba(242,160,61,.5);background:rgba(242,160,61,.10);
  border-radius:12px;padding:15px 17px;margin:0 0 20px;
  font-size:15px;line-height:1.55;color:var(--text);
}
.callout b{color:var(--amber);font-weight:600}
.callout.warn{border-color:rgba(232,104,127,.55);background:rgba(232,104,127,.11)}
.callout.warn b{color:var(--rose)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
@keyframes popin{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.reveal-in{animation:popin .5s cubic-bezier(.2,.8,.3,1) both}
@media (prefers-reduced-motion:reduce){.reveal-in{animation:none}}
</style>
</head>

<script>
const app = document.getElementById('app');
const who = document.getElementById('who');
let name = localStorage.getItem('pa_name') || '';
let view = '';           // what's currently rendered, so we don't redraw mid-typing
let targetCache = {};    // roundId -> base64
let timer = null;

const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss = s => Number.isFinite(s)
  ? `${Math.floor(Math.max(0,s)/60)}:${String(Math.floor(Math.max(0,s))%60).padStart(2,'0')}`
  : '--:--';

function renderWho(){
  who.innerHTML = name
    ? `Playing as <b>${esc(name)}</b> &nbsp;<button class="linkish" id="chg">Start Over</button>` : '';
  const c = document.getElementById('chg');
  if (c) c.onclick = startOver;
}

/** Wipes this player's session so the next name begins from nothing. */
function startOver(){
  gen++;                // anything already in flight belongs to the old session
  localStorage.removeItem('pa_name');
  sessionStorage.removeItem('pa_round');
  name = '';
  away = false; needsAck = false; blocked = false; awayCount = 0;
  playing = false; imageReady = false; aborted = false;
  repaintTarget = null;
  targetCache = {};
  clearInterval(timer);
  renderWho();          // the header must go with the name
  view = '';
  tick();
}

async function api(path, opts){
  const r = await fetch(path, opts);
  const d = await r.json().catch(()=>({error:'Server did not respond properly.'}));
  if (!r.ok) throw new Error(d.error || 'Request failed.');
  return d;
}

async function loadImage(kind, key, el, plain){
  if (kind === 'target' && !plain) imageReady = false;
  const ck = kind+':'+key;
  if (!targetCache[ck]) {
    const q = kind === 'target' ? `&name=${encodeURIComponent(name)}` : '';
    try { targetCache[ck] = (await api(`/api/image?kind=${kind}&id=${key}${q}`)).b64; }
    catch { el.innerHTML = '<div class="thumb none">no image</div>'; return; }
  }
  // Once results are out there is nothing left to protect, so show it whole.
  if (kind === 'target' && !plain) paintProtected(el, targetCache[ck]);
  else el.innerHTML = `<img alt="" src="data:image/jpeg;base64,${targetCache[ck]}">`;
}

/**
 * The question image is painted into a canvas rather than an <img>, so the
 * browser's own save, drag and long-press routes lead nowhere, and it carries
 * the player's name so a leaked screenshot is traceable. This is friction, not
 * prevention — nothing in a browser can stop a camera or PrintScreen.
 */
function paintProtected(el, b64){
  const img = new Image();
  img.onload = () => {
    const mark = document.createElement('canvas');
    mark.width = img.naturalWidth; mark.height = img.naturalHeight;
    const c = document.createElement('canvas');
    c.width = mark.width; c.height = mark.height;
    const g = mark.getContext('2d');
    g.drawImage(img, 0, 0);

    const MARK = 'NonStop io Technologies';
    const size = Math.round(c.width / 30);
    g.save();
    g.globalAlpha = 0.18;
    g.fillStyle = '#ffffff';
    g.font = `700 ${size}px Inter, system-ui, sans-serif`;
    g.rotate(-Math.PI / 9);
    const step = g.measureText(MARK).width + size * 2.4;
    for (let y = -c.height; y < c.height * 2; y += size * 4.2) {
      for (let x = -c.width; x < c.width * 2; x += step) g.fillText(MARK, x, y);
    }
    g.restore();

    const ctx = c.getContext('2d');
    ctx.drawImage(mark, 0, 0);

    repaintTarget = (hide) => {
      if (!c.isConnected) { repaintTarget = null; return; }
      if (hide) { ctx.fillStyle = '#1c1a26'; ctx.fillRect(0, 0, c.width, c.height); }
      else { ctx.drawImage(mark, 0, 0); }
    };

    imageReady = true;
    el.querySelectorAll('canvas, .shimmer').forEach((n) => n.remove());
    el.insertBefore(c, el.firstChild);
    if (!el.querySelector('.guard')) {
      const guard = document.createElement('div');
      guard.className = 'guard';
      el.appendChild(guard);
    }
    applyGuard();
  };
  img.src = 'data:image/jpeg;base64,' + b64;
}

// Blanks the question whenever the tab or window loses focus — the alt-tab to
// another AI tool is the route worth closing.
let away = false;
let playing = false;     // only a live round is worth counting
let imageReady = false;  // and only once the image is actually on screen
let aborted = false;   // the host replaced the round we were in
let gen = 0;           // bumped whenever the player resets; older replies are stale
let repaintTarget = null;   // redraws the question image on demand
let needsAck = false;       // hidden after a trip away until they ask for it back
let awayCount = 0;
let blocked = false;        // a second trip away costs the image for the round

function guardMessage(){
  if (away) return '<div>Image hidden while you are away from this tab.</div>';
  if (blocked) {
    return `<div><b>The image is hidden for the rest of this round.</b><br>
      You were given one chance and left this tab again, so it will not come back.
      You can still write and submit your prompt from what you remember, and it is scored
      exactly like everyone else's.</div>`;
  }
  return `<div><b>You switched away from this tab.</b><br>
    In case that was an accident, here is one chance to carry on — click below and the image
    comes straight back. Leave this tab again and it stays hidden for the rest of the round,
    and you would have to finish from memory.
    <br>Every trip away is counted next to your name on the results screen.
    <br><button class="btn" id="unhide" style="margin-top:18px">Show the image</button></div>`;
}

function applyGuard(){
  const hidden = away || needsAck || blocked;
  document.querySelectorAll('.target').forEach(t => t.classList.toggle('hidden-guard', hidden));
  const g = document.querySelector('.guard');
  if (g) {
    g.innerHTML = guardMessage();
    const u = document.getElementById('unhide');
    if (u) u.onclick = () => { needsAck = false; applyGuard(); };
  }
  // CSS alone would only blur it. Clearing the pixels means there is nothing left in the
  // canvas to blur, screenshot or inspect.
  if (repaintTarget) repaintTarget(hidden);
}

const setAway = v => {
  // blur and visibilitychange both fire for one switch; count the transition, not the events
  if (v === away) return;
  away = v;
  if (v && playing && imageReady) {
    awayCount++;
    needsAck = true;
    if (awayCount >= 2) blocked = true;   // the first time was the warning
  }
  applyGuard();
  if (v && playing && imageReady && name) {
    api('/api/flag',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name})}).catch(()=>{});
  }
};
document.addEventListener('visibilitychange', () => setAway(document.hidden));
window.addEventListener('blur', () => setAway(true));
window.addEventListener('focus', () => setAway(false));
window.addEventListener('pagehide', () => setAway(true));
// Events are inconsistent across browsers and window managers, so the real
// check is asking the document directly, a few times a second.
// A tab opened in the background has not lost anything yet, so nothing counts
// until the page has actually held focus once.
let everFocused = document.hasFocus();
window.addEventListener('focus', () => { everFocused = true; });
document.addEventListener('pointerdown', () => { everFocused = true; });
setInterval(() => {
  if (document.hidden) return setAway(true);
  if (!everFocused) return;
  setAway(!document.hasFocus());
}, 300);
document.addEventListener('contextmenu', e => {
  if (e.target.closest && e.target.closest('.target')) e.preventDefault();
});
document.addEventListener('dragstart', e => {
  if (e.target.closest && e.target.closest('.target')) e.preventDefault();
});

// ---- screens --------------------------------------------------------------

const RULES = `<ul class="rules">
  <li>Everyone gets the <b>same image</b> and the <b>same five minutes</b>, starting together when the host opens the round.</li>
  <li>Write the prompt you think produced that image. After the round, every prompt is turned into an image, so you will see exactly what yours makes.</li>
  <li><b>One entry each</b>, and you can revise it as many times as you like until the clock runs out.</li>
  <li>Whatever is in the box at zero is <b>submitted for you</b> — you do not have to click anything.</li>
</ul>`;

const ROSTER = '<div class="roster"><h3 id="rtitle">In the room</h3><div class="chips" id="chips"></div></div>';

function paintRoster(players, live){
  const box = document.getElementById('chips');
  if (!box) return;
  const list = players || [];
  document.getElementById('rtitle').textContent =
    live ? `In the room — ${list.length} playing` : `In the room — ${list.length} joined so far`;
  box.innerHTML = list.length
    ? list.map(p => {
        const me = p.name.toLowerCase() === name.toLowerCase();
        return `<span class="chip${me?' me':''}${p.done?' done':''}">${esc(p.name)}${p.done?' ✓':''}</span>`;
      }).join('')
    : '<span class="rosterempty">Nobody else yet. You are first in.</span>';
}

function screenName(){
  view='name';
  app.innerHTML = `<div class="card">
    <h2>Enter the arena</h2>
    <p class="lede">Use the full name printed on your office ID card, so the leaderboard makes sense to everyone else. Everyone's clock starts together when the host opens the round.</p>
    <div class="callout"><b>Ignore the watermark.</b> The repeated “NonStop io Technologies” text across the image is not part of the picture. Do not describe it in your prompt.</div>
    ${RULES}
    <div class="callout warn"><b>Stay on this tab.</b> Switching away hides the image and is counted. You get one chance to bring it back; after that it stays hidden for the round. The count appears next to your name on the results screen.</div>
    <label for="nm" style="margin-top:22px">Full name</label>
    <input type="text" id="nm" autocomplete="name" placeholder="e.g. Rushikesh Nere">
    <div class="err" id="err"></div>
    <button class="btn" id="go" style="margin-top:6px">Join</button>
  </div>`;
  const nm = document.getElementById('nm');
  nm.focus();
  const go = () => {
    const v = nm.value.trim();
    if (!v) { document.getElementById('err').textContent='Type your name to continue.'; return; }
    gen++;              // a new name is a new session; drop older replies
    name = v; localStorage.setItem('pa_name', v); renderWho();
    document.getElementById('go').disabled = true;
    api('/api/join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name})})
      .catch(()=>{}).then(()=>{ view=''; tick(); });
  };
  document.getElementById('go').onclick = go;
  nm.onkeydown = e => { if (e.key==='Enter') go(); };
}

function screenAborted(){
  if (view === 'aborted') return; view = 'aborted';
  clearInterval(timer);
  app.innerHTML = `<div class="state">
      <h2>The session was aborted by the admin</h2>
      <p class="lede" style="margin:0 auto">This session has been called off and a new one is being set up. Nothing from it counts any more. Click Start Over to enter your name and join the new session.</p>
    </div>
    <div class="card" style="text-align:center">
      <button class="btn" id="rejoin">Start Over</button>
    </div>`;
  document.getElementById('rejoin').onclick = startOver;
}

function screenLobby(){
  if (view === 'lobby') return; view = 'lobby';

      <h2><span class="dot"></span>Waiting for the host</h2>

    </div>

    ${RULES}
    <div class="callout warn"><b>Stay on this tab.</b> Switching away hides the image and is counted. You get one chance to bring it back; after that it stays hidden for the round. The count appears next to your name on the results screen.</div></div>` + ROSTER;
}

function screenWaiting(msg, sub){
  const k='wait:'+msg;
  if (view===k) return; view=k;
  app.innerHTML = `<div class="state"><h2><span class="dot"></span>${esc(msg)}</h2><p class="lede" style="margin:0 auto">${esc(sub)}</p></div>`;
}

function screenPlay(state){
  if (view==='play:'+state.round.id) return;
  view='play:'+state.round.id;
  app.innerHTML = `
    <div class="clockrow">
      <div class="clock" id="clock">--:--</div>
      <div class="clocklabel">Study the image, write the prompt you think produced it. One entry each. Whatever is in the box when the clock hits zero is submitted for you.</div>
    </div>
    <div class="card" style="margin-bottom:24px">
      <h3 style="font-family:var(--display);font-size:19px;font-weight:700;margin:0 0 14px">How this works</h3>
      ${RULES}
      <div class="callout" style="margin-top:18px"><b>Ignore the watermark.</b> The repeated “NonStop io Technologies” text across the image is not part of the picture. Do not describe it in your prompt.</div>
      <div class="callout warn" style="margin-bottom:0"><b>Stay on this tab.</b> Switching away hides the image and is counted. You get one chance to bring it back; after that it stays hidden for the round. The count appears next to your name on the results screen.</div>
    </div>
    <div class="target" id="target"><div class="shimmer"></div><div class="guard"></div></div>
    <div class="card">
      <label for="pr">Your prompt</label>
      <textarea id="pr" placeholder="Describe the subject, the setting, the style, the light, the framing…"></textarea>
      <div class="hint">You can revise this until the clock runs out.</div>
      <div class="err" id="err"></div>
      <button class="btn" id="send" style="margin-top:14px">Submit prompt</button>
    </div>` + ROSTER;
  loadImage('target', state.round.id, document.getElementById('target'));

  const ta = document.getElementById('pr');
  if (state.draft) ta.value = state.draft;
  // Kept on the server as they type, so a closed tab or a dead battery does not
  // cost them their entry — the host's close sweeps saved drafts into entries.
  let saveTimer = null;
  ta.addEventListener('input', () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      api('/api/draft',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,prompt:ta.value})}).catch(()=>{});
    }, 1200);
  });

  const send = document.getElementById('send');
  send.onclick = async () => {
    const prompt = document.getElementById('pr').value.trim();
    const err = document.getElementById('err');
    if (prompt.length < 3) { err.textContent='Write something before submitting.'; return; }
    send.disabled = true; send.textContent = 'Rendering your prompt…'; err.textContent='';
    try { await api('/api/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,prompt})});
      view=''; tick();
    } catch(e){ err.textContent=e.message; send.disabled=false; send.textContent='Submit prompt'; }
  };
}

function screenLocked(state){
  const k='lock:'+state.round.id;
  if (view===k) return; view=k;
  clearInterval(timer);
  app.innerHTML = `<div class="state">
    <h2>Time's up — your entry is locked</h2>
    <p class="lede" style="margin:0 auto">Results appear here the moment the host publishes them.</p>
  </div>
  <div class="card"><label>Your prompt</label><p class="pprompt" style="margin-top:4px">${esc(state.mine.prompt)}</p></div>`;
}

function screenOutOfTime(state){
  const k='late:'+state.round.id;
  if (view===k) return; view=k;
  clearInterval(timer);
  app.innerHTML = `<div class="state">
    <h2>Time's up</h2>
    <p class="lede" style="margin:0 auto">The box was empty when the clock ran out, so there was nothing to submit. Results appear here once the host publishes them.</p>
  </div>`;
}

/** Sends whatever is in the box the moment the clock runs out. */
async function autoSubmit(){
  const ta = document.getElementById('pr');
  if (!ta) return;
  const prompt = ta.value.trim();
  if (prompt.length < 3) return;
  const editing = Boolean(document.getElementById('save'));
  ta.disabled = true;
  const btn = document.getElementById('send') || document.getElementById('save');
  if (btn) { btn.disabled = true; btn.textContent = 'Time up — submitting for you…'; }
  try {
    await api(editing ? '/api/update' : '/api/submit', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ name, prompt, auto: true }),
    });
  } catch (e) { /* nothing left to do at zero */ }
}

let entrySig = '';   // last painted prompt, so a stale panel gets repainted

function screenSubmitted(state){
  const k='sent:'+state.round.id;
  if (view===k) {
    const t=document.getElementById('tally');
    if(t) t.innerHTML=`<b>${state.entries}</b> ${state.entries===1?'entry':'entries'} in`;
    // The count of remaining edits changes under us; refresh the panel when it
    // does, but never while they are mid-edit or we would wipe their typing.
    const sig = state.mine.prompt;
    if (sig !== entrySig && !document.getElementById('save')) paintEntry(state);
    return;
  }
  view=k;
  app.innerHTML = `
    <div class="clockrow">
      <div class="clock" id="clock">--:--</div>
      <div class="clocklabel">Your entry is saved. Keep comparing against the image and revise as often as you like until the clock runs out.</div>
    </div>
    <div class="target" id="target"><div class="shimmer"></div><div class="guard"></div></div>
    <div class="card" id="entrybox"></div>` + ROSTER;
  loadImage('target', state.round.id, document.getElementById('target'));
  paintEntry(state);
}

function paintEntry(state){
  const box = document.getElementById('entrybox');
  if (!box) return;
  box.innerHTML = `
    <label>Your prompt</label>
    <p class="pprompt" style="margin-top:4px" id="cur">${esc(state.mine.prompt)}</p>
    <div class="row" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
      <button class="btn ghost" id="edit">Edit prompt</button>
      <span class="tally" id="tally"><b>${state.entries}</b> ${state.entries===1?'entry':'entries'} in</span>
    </div>
    <div class="err" id="err"></div>`;
  entrySig = state.mine.prompt;
  const e = document.getElementById('edit');
  if (e) e.onclick = () => editEntry(state);
}

function editEntry(state){
  const box = document.getElementById('entrybox');
  box.innerHTML = `
    <label for="pr">Your prompt</label>
    <textarea id="pr"></textarea>
    <div class="hint">Revise as often as you like. Images are made after the round ends, so only your final wording counts.</div>
    <div class="err" id="err"></div>
    <div class="row" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
      <button class="btn" id="save">Save changes</button>
      <button class="btn ghost" id="cancel">Keep the original</button>
    </div>`;
  const ta = document.getElementById('pr');
  ta.value = state.mine.prompt;
  ta.focus();
  document.getElementById('cancel').onclick = () => paintEntry(state);
  document.getElementById('save').onclick = async () => {
    const prompt = ta.value.trim();
    const err = document.getElementById('err');
    const save = document.getElementById('save');
    if (prompt.length < 3) { err.textContent = 'Write something before saving.'; return; }
    save.disabled = true; save.textContent = 'Re-rendering…'; err.textContent = '';
    try {
      await api('/api/update',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,prompt})});
      view=''; tick();
    } catch(e) {
      err.textContent = e.message;
      save.disabled = false; save.textContent = 'Save changes';
    }
  };
}

async function screenResults(){
  const d = await api('/api/results');
  if (!d.published) { screenWaiting('Scoring in progress','The judge is reading every prompt. Hang tight.'); return; }
  const k='res:'+d.round.id;
  if (view===k) return; view=k;

  const rows = d.board.map(r => `
    <div class="entry ${r.id===d.winnerId?'win':''}">
      <div class="thumb" id="th_${r.id}" data-zoom="sub:${r.id}" data-label="${esc(r.name)}">${r.hasImage?'<div class="shimmer"></div>':'<div class="thumb none">render blocked</div>'}</div>
      <div>
        <div class="ehead">
          <span class="rank">${r.rank}</span>
          <span class="pname">${esc(r.name)}</span>
          ${r.id===d.winnerId?'<span class="crown">winner</span>':''}
          ${r.blurCount?`<span class="flag">left the tab ${r.blurCount}\u00d7</span>`:''}
          <span class="pscore">${r.score}</span>
        </div>
        <p class="pprompt">${esc(r.prompt)}</p>
        <p class="pnotes">${esc(r.notes)}</p>
      </div>
    </div>`).join('');

  app.innerHTML = `
    <h2>Results</h2>
    <p class="lede">Every prompt below was rendered with the same model that made the target, so you can see exactly what each one produced.</p>
    <div class="shot" id="shot" data-zoom="target:${d.round.id}" data-label="The original image"><div class="shimmer" style="aspect-ratio:1;height:auto"></div></div>
    <p class="shotcap">The image everyone was given.</p>
    <div class="verdict"><h3>${d.winnerId?'Why this prompt won':'No winner this round'}</h3><p>${esc(d.verdict)}</p></div>
    <div class="reveal"><h3>The hidden prompt behind the image</h3><code>${esc(d.secretPrompt)}</code></div>
    ${rows}
    ${d.board.some(r=>r.blurCount)?'<p class="flagnote">A badge shows how many times someone switched away from this tab during the round. Notifications and second monitors trigger it too, so read it as a signal rather than a verdict.</p>':''}`;

  app.classList.add('reveal-in');
  setTimeout(() => app.classList.remove('reveal-in'), 700);
  celebrate();
  loadImage('target', d.round.id, document.getElementById('shot'), true);
  d.board.forEach(r => { if (r.hasImage) loadImage('sub', r.id, document.getElementById('th_'+r.id)); });
}

// ---- loop -----------------------------------------------------------------

function runClock(endsAt, skew){
  clearInterval(timer);
  const el = () => document.getElementById('clock');
  const paint = () => {
    const e = el(); if (!e) return;
    const left = endsAt - (Math.floor(Date.now()/1000) + skew);
    e.textContent = mmss(left);
    e.classList.toggle('urgent', left <= 60);
    if (left <= 0) {
      clearInterval(timer);
      e.textContent = '0:00';
      autoSubmit().finally(() => { view=''; tick(); });
    }
  };
  paint(); timer = setInterval(paint, 250);
}

async function tick(){
  try {
    if (!name) { if (view!=='name') screenName(); return; }
    const mine = gen;
    const seen = JSON.parse(sessionStorage.getItem('pa_round') || 'null');
    const from = seen ? '&from=' + encodeURIComponent(seen.id) : '';
    const s = await api('/api/state?name=' + encodeURIComponent(name) + from);

    // A reply that was already in flight when the player reset belongs to the
    // session they just left. Acting on it re-arms the abort screen they have
    // just dismissed, so drop it.
    if (mine !== gen) return;

    // The server says outright when the round we were showing was aborted, so
    // this fires from any screen — including a results page someone is reading.
    if (s.sessionAborted) aborted = true;
    if (aborted || (s.round && s.round.status === 'aborted')) { playing = false; return screenAborted(); }
    if (s.round) sessionStorage.setItem('pa_round', JSON.stringify({ id: s.round.id, status: s.round.status }));

    if (!s.round) { clearInterval(timer); return screenWaiting('No round yet','The host has not generated a question. This page updates on its own.'); }

    playing = s.round.status === 'live';
    if (s.round.status === 'draft') { screenLobby(); paintRoster(s.players, false); return; }
    if (s.round.status === 'published') { clearInterval(timer); return screenResults(); }
    if (s.round.status === 'closed') { clearInterval(timer); return screenWaiting('Time is up','Entries are closed. Results land here shortly.'); }

    const skew = s.round.serverTime - Math.floor(Date.now()/1000);

    // A player already sitting on the waiting screen when the host starts the
    // round gets their clock anchored here, on the server, not in the browser.
    if (!s.myEndsAt) {
      await api('/api/join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name})}).catch(()=>{});
      view=''; return tick();
    }

    const left = s.myEndsAt - (Math.floor(Date.now()/1000) + skew);
    if (s.mine && left <= 0) return screenLocked(s);
    if (s.mine) { screenSubmitted(s); paintRoster(s.players, true); runClock(s.myEndsAt, skew); return; }
    if (left <= -2) return screenOutOfTime(s);
    screenPlay(s);
    paintRoster(s.players, true);
    runClock(s.myEndsAt, skew);
  } catch(e){ /* transient network blips are not worth a screen change */ }
}

/**
 * One burst when the results land — poppers from both lower corners. Physics
 * rather than a loop of effects, so it lands once and then gets out of the way.
 */
function celebrate(){
  // Someone with reduced motion turned on still gets a moment, just a calm one.
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('confetti');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';

  const colors = ['#f2a03d','#5fd0d6','#e8687f','#f2efea','#9b8cff','#6fd08c'];
  const bits = [];
  const popper = (x, y, aim) => {
    for (let i = 0; i < (calm ? 26 : 90); i++) {
      const spread = (Math.random() - 0.5) * 0.85;
      const speed = (calm ? 6 : 11) + Math.random() * (calm ? 7 : 15);
      bits.push({
        x, y,
        vx: Math.cos(aim + spread) * speed,
        vy: Math.sin(aim + spread) * speed,
        w: 5 + Math.random() * 7, h: 8 + Math.random() * 9,
        rot: Math.random() * Math.PI, spin: calm ? 0 : (Math.random() - 0.5) * 0.4,
        color: colors[(Math.random() * colors.length) | 0],
        life: 0, drift: (Math.random() - 0.5) * 0.35,
      });
    }
  };
  // Five blasts, one every 0.8s, alternating where they come from.
  const BURSTS = [
    [-10, H + 10, -Math.PI / 3.1],                 // bottom left
    [W + 10, H + 10, -Math.PI + Math.PI / 3.1],    // bottom right
    [W / 2, -10, Math.PI / 2],                     // overhead
    [-10, H * 0.7, -Math.PI / 5],                  // left, flatter
    [W + 10, H * 0.7, -Math.PI + Math.PI / 5],     // right, flatter
  ];
  BURSTS.forEach((b, i) => setTimeout(() => popper(b[0], b[1], b[2]), i * 800));

  const start = performance.now();
  (function frame(){
    const age = performance.now() - start;
    ctx.clearRect(0, 0, W, H);
    for (const b of bits) {
      b.life++;
      b.vy += 0.42;                 // gravity
      b.vx *= 0.99; b.vy *= 0.99;   // drag
      b.x += b.vx + b.drift; b.y += b.vy;
      b.rot += b.spin;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.globalAlpha = age < 4000 ? 1 : Math.max(0, 1 - (age - 4000) / 1000);
      ctx.fillStyle = b.color;
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * (0.4 + Math.abs(Math.cos(b.rot)) * 0.6));
      ctx.restore();
    }
    if (age < 5000) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, W, H);
  })();
}

// Any rendered image opens full size; the key is the cache entry it came from.
const lb = document.getElementById('lb');
function openImage(ck, label){
  if (!targetCache[ck]) return;
  document.getElementById('lbimg').src = 'data:image/jpeg;base64,' + targetCache[ck];
  document.getElementById('lbname').textContent = label || '';
  lb.classList.add('open');
}
function closeImage(){ lb.classList.remove('open'); document.getElementById('lbimg').src = ''; }
document.getElementById('lbx').onclick = closeImage;
lb.addEventListener('click', e => { if (e.target === lb) closeImage(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeImage(); });
document.addEventListener('click', e => {
  const z = e.target.closest && e.target.closest('[data-zoom]');
  if (z) openImage(z.dataset.zoom, z.dataset.label || '');
});

renderWho();
tick();

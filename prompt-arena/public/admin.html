<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prompt Arena — host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12111a;--panel:#1c1a26;--raise:#242131;--line:#302c40;
  --text:#f2efea;--muted:#948ead;--amber:#4e9df0;--cyan:#f2a03d;--rose:#e8687f;
  --display:'Bricolage Grotesque',Georgia,serif;--body:'Inter',system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:#0d1320;color:var(--text);font-family:var(--body);line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.brand{height:30px;width:auto;background:#fff;border-radius:7px;padding:5px 9px;display:block}
.brandrow{display:flex;align-items:center;gap:14px}
.brandfoot{display:flex;justify-content:center;padding:44px 0 0;opacity:.55}
.brandfoot .brand{height:24px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 90px}
.hostbar{
  margin:0 -20px 26px;padding:11px 20px;
  background:var(--amber);color:#04121f;font-weight:600;font-size:14px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.hostbar span{opacity:.82;font-weight:500}
.linkish{background:none;border:0;color:#04121f;text-decoration:underline;padding:0;font:inherit;font-weight:600;cursor:pointer}
.bar{padding-top:6px}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:30px}
.logo{font-family:var(--display);font-size:22px;font-weight:700;margin:0;letter-spacing:-.02em}
.logo span{color:var(--amber)}
.tag{font-size:13px;color:var(--muted)}
h2{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
p.lede{color:var(--muted);margin:0 0 20px;max-width:58ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
input[type=password]{width:100%;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:13px 14px;font:inherit}
input:focus{border-color:var(--amber);outline:none}
.btn{background:var(--amber);color:#04121f;border:0;border-radius:10px;padding:13px 20px;font-weight:600;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--rose);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.preview{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--raise);aspect-ratio:1;margin-bottom:18px}
.preview img{width:100%;height:100%;object-fit:cover}
.shimmer{width:100%;height:100%;background:linear-gradient(100deg,var(--raise) 30%,#2e2a3e 50%,var(--raise) 70%);background-size:220% 100%;animation:sweep 1.5s linear infinite}
@keyframes sweep{to{background-position:-220% 0}}
@media (prefers-reduced-motion:reduce){.shimmer{animation:none}}
.secret{background:var(--raise);border:1px dashed var(--line);border-radius:10px;padding:14px 16px;font-size:14px;color:var(--cyan);margin-bottom:6px;line-height:1.6}
.secret b{display:block;color:var(--muted);font-size:13px;margin-bottom:6px;font-weight:600}
.clock{font-family:var(--display);font-weight:700;font-size:clamp(46px,11vw,72px);line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--amber)}
.clock.urgent{color:var(--rose)}
.stat{font-size:15px;color:var(--muted);margin-top:6px}
.stat b{color:var(--cyan);font-size:28px;font-family:var(--display);vertical-align:-2px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:18px 0 10px}
.bar i{display:block;height:100%;background:var(--amber);width:0;transition:width .35s ease}
.note{border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin:22px 0 0;font-size:14px;line-height:1.6;color:var(--muted)}
.note b{color:var(--text);font-weight:600}
.note.tidy{border-color:rgba(242,160,61,.5);background:rgba(242,160,61,.08)}
.note.tidy b{color:var(--cyan)}
.note.warn{border-color:rgba(232,104,127,.55);background:rgba(232,104,127,.10)}
.note.warn b{color:var(--rose)}
.note code{display:block;margin-top:10px;color:var(--text);font-size:13px;word-break:break-all;line-height:1.5}
.dotpulse{color:var(--amber);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dotpulse{animation:none}}
.big{font-family:var(--display);font-weight:700;font-size:clamp(34px,8vw,52px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.err{color:var(--rose);font-size:14px;min-height:20px;margin-top:12px}
.ok{color:var(--cyan);font-size:14px;margin-top:12px}
.share{font-size:14px;color:var(--muted);margin-top:16px;word-break:break-all}
.share code{color:var(--text)}
</style>
</head>

<script>
const app=document.getElementById('app');
let key=sessionStorage.getItem('pa_key')||'';
let view='',timer=null,imgCache={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss=s=>Number.isFinite(s)
  ? `${Math.floor(Math.max(0,s)/60)}:${String(Math.floor(Math.max(0,s))%60).padStart(2,'0')}`
  : '--:--';

async function api(path,body){
  const r=await fetch(path,{method:body?'POST':'GET',headers:{'x-admin-key':key,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({error:'Server did not respond properly.'}));
  if(!r.ok) throw new Error(d.error||'Request failed.');
  return d;
}
async function showImage(roundId,el){
  if(!imgCache[roundId]){
    const d=await (await fetch('/api/image?kind=target&id='+roundId,{headers:{'x-admin-key':key}})).json();
    imgCache[roundId]=d.b64;
  }
  el.innerHTML=`<img alt="" src="data:image/jpeg;base64,${imgCache[roundId]}">`;
}
function busy(btn,label){btn.disabled=true;btn.dataset.old=btn.textContent;btn.textContent=label;}
function done(btn){btn.disabled=false;btn.textContent=btn.dataset.old;}

let landed=false;   // the console opens on a neutral screen, not mid-round
let gen=0;          // bumped whenever the operator takes over the screen

const ROUND_LABEL = {
  draft:'an image is generated and waiting to start',
  live:'a round is running right now',
  closed:'entries are closed and waiting to be scored',
  published:'results from the last round are published',
};

// Re-entering the key here is deliberate: this throws a live round away, so an
// unattended console should not be one click from wiping a session.
function newSession(){
  gen++; view='newsession'; clearInterval(timer);
  app.innerHTML=`<div class="card">
    <h2>Start a new session</h2>
    <p class="lede">This abandons whatever is running and generates a fresh image. Anyone playing right now is told the session was aborted and is moved to the new one. Confirm with your admin key.</p>
    <input type="password" id="k2" placeholder="Admin key" autocomplete="current-password">
    <div class="err" id="err"></div>
    <div class="row">
      <button class="btn" id="doit">Start New Session</button>
      <button class="btn ghost" id="back">Cancel</button>
    </div>
  </div>`;
  const k2=document.getElementById('k2'); k2.focus();
  const run=async()=>{
    const typed=k2.value.trim();
    const err=document.getElementById('err');
    if(!typed){err.textContent='Enter your admin key to confirm.';return;}
    const btn=document.getElementById('doit');
    busy(btn,'Rendering…'); err.textContent='';
    try{
      const r=await fetch('/api/admin/session',{method:'POST',headers:{'x-admin-key':typed,'content-type':'application/json'},body:'{}'});
      const d=await r.json().catch(()=>({error:'Server did not respond properly.'}));
      if(!r.ok) throw new Error(d.error||'Could not start a new session.');
      key=typed; sessionStorage.setItem('pa_key',key);
      landed=true; view=''; tick();
    }catch(e){ err.textContent=e.message; done(btn); }
  };
  document.getElementById('doit').onclick=run;
  document.getElementById('back').onclick=()=>{view='';tick();};
  k2.onkeydown=e=>{if(e.key==='Enter')run();};
}
document.getElementById('newsession').onclick=newSession;

const CLEANUP_CMD = 'npx wrangler d1 execute prompt-arena --remote --command="UPDATE submissions SET image_b64 = NULL WHERE round_id NOT IN (SELECT id FROM rounds ORDER BY created_at DESC LIMIT 3)"';

/** Storage is scanned once per console load, never on the poll. */
async function paintStorage(){
  const box=document.getElementById('storage');
  if(!box)return;
  let d;
  try{ d=await api('/api/admin/storage'); }catch{ box.innerHTML=''; return; }
  if(!document.getElementById('storage'))return;

  const line=`<b>${d.mb} MB</b> stored across ${d.rounds} ${d.rounds===1?'round':'rounds'} and ${d.entries} ${d.entries===1?'entry':'entries'} — ${d.percent}% of the 5 GB free limit.`;

  if(d.level==='ok'){
    box.className='note';
    box.innerHTML=line+' Nothing to do.';
    return;
  }

  const why = d.level==='warn'
    ? 'This is worth clearing now rather than later.'
    : 'Worth a tidy-up when convenient — images are almost all of it.';
  const abandoned = d.abandoned>1
    ? ` ${d.abandoned} abandoned rounds are also taking up space.` : '';

  box.className='note '+d.level;
  box.innerHTML=`${line} ${why}${abandoned}
    <br><br>Clearing images from all but the last three rounds keeps every prompt, name and
    score — old results pages still open, just without thumbnails. Full instructions are in
    <b>MAINTENANCE.md</b>. The one command that does most of it:
    <code>${CLEANUP_CMD.replace(/</g,'&lt;')}</code>
    <br>D1 keeps 30 days of history, so the reported size falls a month after you run it.`;
}

function screenHome(s){
  if(view==='home')return; view='home'; clearInterval(timer);
  const state = s.round ? (ROUND_LABEL[s.round.status] || 'a round is in progress') : 'nothing has been set up yet';
  app.innerHTML=`<div class="card">
    <h2>You are signed in as the host</h2>
    <p class="lede">This is where rounds are generated, opened and scored. Right now, ${state}.</p>
    <div class="row">
      <button class="btn" id="go">${s.round?'Go to the current round':'Set up the first round'}</button>
      ${s.round?'<button class="btn ghost" id="fresh">Start a new session</button>':''}
    </div>
    <div class="err" id="err"></div>
    <div class="note" id="storage">Checking storage…</div>
  </div>`;
  paintStorage();
  document.getElementById('go').onclick=async e=>{
    if(!s.round){ busy(e.target,'Rendering…');
      try{await api('/api/admin/generate',{});}catch(err){document.getElementById('err').textContent=err.message;done(e.target);return;}
    }
    landed=true; view=''; tick();
  };
  const f=document.getElementById('fresh'); if(f) f.onclick=newSession;
}

function screenLock(msg){
  gen++; view='lock';clearInterval(timer);landed=false;
  document.getElementById('newsession').hidden=true;
  app.innerHTML=`<div class="card"><h2>Host access</h2>
    <p class="lede">Enter the admin key you set when deploying.</p>
    <input type="password" id="k" placeholder="Admin key">
    <div class="err">${esc(msg||'')}</div>
    <button class="btn" id="go">Unlock</button></div>`;
  const k=document.getElementById('k');k.focus();
  const go=()=>{key=k.value.trim();sessionStorage.setItem('pa_key',key);view='';tick();};
  document.getElementById('go').onclick=go;
  k.onkeydown=e=>{if(e.key==='Enter')go();};
}

function shareLine(){
  return `<div class="share">Players go to <code>${location.origin}/</code></div>`;
}

function screenEmpty(){
  if(view==='empty')return;view='empty';clearInterval(timer);
  app.innerHTML=`<div class="card"><h2>No round yet</h2>
    <p class="lede">Generating a round invents a random hidden prompt and renders it. Nobody sees the prompt — only the image.</p>
    <button class="btn" id="gen">Generate round</button>
    <div class="err" id="err"></div>${shareLine()}</div>`;
  document.getElementById('gen').onclick=async e=>{
    busy(e.target,'Rendering…');
    try{await api('/api/admin/generate',{});view='';tick();}
    catch(err){document.getElementById('err').textContent=err.message;done(e.target);}
  };
}

function screenDraft(s){
  if(view==='draft:'+s.round.id)return;view='draft:'+s.round.id;clearInterval(timer);
  app.innerHTML=`<h2>Ready to start</h2>
    <p class="lede">Check the image is clear enough to guess. Opening the round starts the same ${Math.round(s.roundSeconds/60)}-minute clock for everyone at once, so wait until the room has joined.</p>
    <div class="preview" id="pv"><div class="shimmer"></div></div>
    <div class="secret"><b>Hidden prompt — do not show the room</b>${esc(s.round.secretPrompt)}</div>
    <div class="row">
      <button class="btn" id="start">Start the ${Math.round(s.roundSeconds/60)}-minute round</button>
      <button class="btn ghost" id="again">Generate a different image</button>
    </div>
    <div class="err" id="err"></div>${shareLine()}`;
  showImage(s.round.id,document.getElementById('pv'));
  document.getElementById('start').onclick=async e=>{
    busy(e.target,'Starting…');
    try{await api('/api/admin/start',{});view='';tick();}
    catch(err){document.getElementById('err').textContent=err.message;done(e.target);}
  };
  document.getElementById('again').onclick=async e=>{
    busy(e.target,'Rendering…');
    try{await api('/api/admin/discard',{});await api('/api/admin/generate',{});view='';tick();}
    catch(err){document.getElementById('err').textContent=err.message;done(e.target);}
  };
}

function screenLive(s,skew){
  if(view!=='live:'+s.round.id){
    view='live:'+s.round.id;
    app.innerHTML=`<h2>Round is live</h2>
      <p class="lede">Everyone is on the same clock. Entries close on their own at zero, and anything still being typed is submitted automatically.</p>
      <div class="clock" id="clock">--:--</div>
      <div class="stat" style="margin-top:18px"><b id="n">0</b> submitted &nbsp;·&nbsp; <b id="j">0</b> joined &nbsp;·&nbsp; <b id="g">0</b> still writing &nbsp;·&nbsp; <b id="f">0</b> left the tab</div>
      <div class="row"><button class="btn ghost" id="stop">Close entries now</button></div>
      <div class="err" id="err"></div>${shareLine()}`;
    document.getElementById('stop').onclick=async e=>{
      busy(e.target,'Closing…');
      try{await api('/api/admin/close',{});view='';tick();}
      catch(err){document.getElementById('err').textContent=err.message;done(e.target);}
    };
    clearInterval(timer);
    timer=setInterval(()=>{
      const el=document.getElementById('clock');if(!el)return;
      const ends=Number(s.round.endsAt);
      if(!Number.isFinite(ends)){el.textContent='--:--';return;}
      const left=ends-(Math.floor(Date.now()/1000)+skew);
      el.textContent=mmss(left);
      el.classList.toggle('urgent',left<=60);
      if(left<=-3){clearInterval(timer);view='';tick();}
    },250);
  }
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  set('n',s.entries); set('j',s.joined); set('g',s.stillGoing); set('f',s.flagged);
}

let rendering=false;

async function renderLoop(){
  if(rendering)return; rendering=true;
  const err=document.getElementById('err');
  try{
    for(;;){
      const r=await api('/api/admin/render',{});
      paintProgress(r.total-r.remaining,r.total);
      if(r.remaining===0)break;
      if(r.stuck){ if(err) err.textContent='Some prompts could not be rendered. Publishing anyway is fine — those entries appear without a picture.'; break; }
    }
  }catch(e){ if(err) err.textContent=e.message+' — press Retry to carry on.'; }
  rendering=false;
  view=''; tick();
}

function paintProgress(done,total){
  const b=document.getElementById('progress'); if(b) b.style.width=(total?Math.round(done/total*100):0)+'%';
  const n=document.getElementById('done'); if(n) n.textContent=done;
  const t=document.getElementById('total'); if(t) t.textContent=total;
}

function screenClosed(s){
  const key='closed:'+s.round.id+':'+(s.pending>0);
  if(view===key){ paintProgress(s.rendered,s.entries); return; }
  view=key; clearInterval(timer);

  if(s.entries===0){
    app.innerHTML=`<h2>Entries closed</h2>
      <p class="lede">Nobody submitted a prompt, so there is nothing to score.</p>
      <div class="row"><button class="btn" id="next">Start a new round</button></div>
      <div class="err" id="err"></div>`;
    document.getElementById('next').onclick=async e=>{
      busy(e.target,'Rendering…');
      try{await api('/api/admin/generate',{});view='';tick();}
      catch(err){document.getElementById('err').textContent=err.message;done(e.target);}
    };
    return;
  }

  if(s.pending>0){
    app.innerHTML=`<h2>Preparing the results</h2>
      <p class="lede">Every prompt is being turned into an image now that entries are closed. This takes about a second per entry. Leave this page open.</p>
      <div class="big"><span id="done">${s.rendered}</span> / <span id="total">${s.entries}</span></div>
      <div class="bar"><i id="progress"></i></div>
      <div class="stat">images made</div>
      <div class="row"><button class="btn ghost" id="retry">Retry</button></div>
      <div class="err" id="err"></div>`;
    paintProgress(s.rendered,s.entries);
    document.getElementById('retry').onclick=()=>{ rendering=false; renderLoop(); };
    renderLoop();
    return;
  }

  app.innerHTML=`<h2>Ready to publish</h2>
    <p class="lede">${s.entries} ${s.entries===1?'prompt is':'prompts are'} in and every image has been made, including any submitted automatically at the buzzer. Scoring reads every entry against the hidden prompt, ranks them, and writes the explanation for the win.</p>
    <div class="row">
      <button class="btn" id="judge">Score and publish results</button>
      <button class="btn ghost" id="next">Skip to a new round</button>
    </div>
    <div class="err" id="err"></div>`;
  document.getElementById('judge').onclick=async ()=>{
    // Scoring runs several calls back to back, so it gets its own screen rather
    // than a button that looks stuck for half a minute.
    view='scoring'; clearInterval(timer);
    app.innerHTML=`<h2>Scoring the entries</h2>
      <p class="lede">Every prompt is being read against the hidden one and ranked, in batches of 25, then the best are compared to pick the winner. This takes up to a minute for a full room. Leave this page open.</p>
      <div class="big"><span class="dotpulse">•</span> ${s.entries} ${s.entries===1?'entry':'entries'}</div>
      <div class="err" id="err"></div>`;
    try{ await api('/api/admin/judge',{}); view=''; tick(); }
    catch(err){
      view='';
      const box=document.getElementById('err');
      if(box) box.textContent=err.message;
      setTimeout(()=>{ view=''; tick(); }, 2500);
    }
  };
  document.getElementById('next').onclick=async e=>{
    busy(e.target,'Rendering…');
    try{await api('/api/admin/generate',{});view='';tick();}
    catch(err){document.getElementById('err').textContent=err.message;done(e.target);}
  };
}

function screenPublished(s){
  if(view==='pub:'+s.round.id)return;view='pub:'+s.round.id;clearInterval(timer);
  app.innerHTML=`<div class="card"><h2>Results are live</h2>
    <p class="lede">Everyone on the player page is now seeing the leaderboard, every prompt, and the image each one produced.</p>
    <div class="row">
      <button class="btn" id="gen">Generate the next round</button>
      <a class="btn ghost" href="/" style="text-decoration:none;display:inline-block">Open the results page</a>
    </div>
    <div class="err" id="err"></div></div>`;
  document.getElementById('gen').onclick=async e=>{
    busy(e.target,'Rendering…');
    try{await api('/api/admin/generate',{});view='';tick();}
    catch(err){document.getElementById('err').textContent=err.message;done(e.target);}
  };
}

async function tick(){
  // The new-session prompt owns the screen until it is answered. Checking once
  // at the top is not enough: a poll already waiting on its fetch would come
  // back and repaint over it, which is why this used to fail intermittently.
  if(view==='newsession')return;
  if(rendering)return;          // the render loop owns the screen while it runs
  if(view==='scoring')return;   // and so does scoring
  if(!key){if(view!=='lock')screenLock();return;}
  const mine=gen;
  let s;
  try{s=await api('/api/admin/state');}
  catch(e){ if(/admin key/i.test(e.message)){sessionStorage.removeItem('pa_key');key='';screenLock(e.message);} return; }
  if(mine!==gen||view==='newsession')return;   // the operator took the screen while we waited
  document.getElementById('newsession').hidden=false;
  if(!landed)return screenHome(s);
  if(!s.round)return screenEmpty();
  const skew=s.round.serverTime-Math.floor(Date.now()/1000);
  if(s.round.status==='draft')return screenDraft(s);
  if(s.round.status==='live')return screenLive(s,skew);
  if(s.round.status==='closed')return screenClosed(s);
  return screenPublished(s);
}

tick();
setInterval(tick,2500);
</script>
